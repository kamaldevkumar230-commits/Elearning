<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Teacher Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #141e30, #243b55
);
            min-height: 100vh;
            color: #fff;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            color: #fff;
            transition: 0.3s;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .course-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            transition: 0.3s;
        }

        .course-card:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .course-img {
            height: 180px;
            object-fit: cover;
            width: 100%;
        }

        .course-body {
            padding: 15px;
            color: #000;
        }

        .btn-custom {
            border-radius: 30px;
        }

        .quick-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
        }
    </style>
</head>

<body>
<div th:replace="navbar :: navbar"></div>
<div class="container py-4">

    <h2 class="mb-4">👨‍🏫 Teacher Dashboard</h2>
    
    <div class="card text-center p-4 mt-4 shadow" style="border-radius: 15px;">

    <h4 class="mb-3">User Management</h4>
    <p class="text-muted">Approve or manage newly registered users</p>

    <a href="/approve-users" class="btn btn-success btn-lg">
        ✅ Approve Users
    </a>

</div>
<br><br>

    <!-- 🔥 STATS -->
    <div class="row g-3">

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-book fa-2x"></i>
                <h6 class="mt-2">Courses</h6>
                <h3 th:text="${courses.size()}">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-users fa-2x"></i>
                <h6 class="mt-2">Students</h6>
                <h3>120</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-video fa-2x"></i>
                <h6 class="mt-2">Lectures</h6>
                <h3>45</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-star fa-2x"></i>
                <h6 class="mt-2">Rating</h6>
                <h3>4.8</h3>
            </div>
        </div>

    </div>

    <!-- 🔥 COURSES -->
    <div class="mt-5">
        <h4>Your Courses</h4>

        <div class="row mt-3">

            <div th:each="course : ${courses}" class="col-md-4">

                <div class="course-card mb-4">

                    <img th:src="@{'/images/' + ${course.imageUrl}}" class="course-img">

                    <div class="course-body">

                        <h5 th:text="${course.title}"></h5>

                        <p th:text="${course.description}" style="font-size:14px;"></p>

                        <p><b>₹ </b><span th:text="${course.price}"></span></p>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{'/add-lecture/' + ${course.id}}"
                               class="btn btn-warning btn-sm btn-custom">
                                Upload
                            </a>

                            <a th:href="@{'/course/' + ${course.id}}"
                               class="btn btn-primary btn-sm btn-custom">
                                Manage
                            </a>

                        </div>

                        <!-- DELETE -->
                        <form action="/delete-course" method="post" class="mt-2">
                            <input type="hidden" name="courseId" th:value="${course.id}">
                            <button class="btn btn-danger btn-sm w-100">
                                🗑 Delete Course
                            </button>
                        </form>

                    </div>

                </div>

            </div>

        </div>

        <div th:if="${#lists.isEmpty(courses)}" class="alert alert-light mt-3">
            No courses added yet.
        </div>

    </div>

    <!-- 🔥 QUICK ACTION -->
    <div class="mt-5 quick-box">

        <h4>Quick Actions</h4>

        <a href="/add-course" class="btn btn-success btn-custom">
            ➕ Add Course
        </a>

    </div>

</div>

<div th:replace="footer :: footer"></div>

</body>
</html>
