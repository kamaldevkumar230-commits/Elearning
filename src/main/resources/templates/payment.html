<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .payment-option {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .payment-option:hover {
            border-color: green;
            background: #f8fff8;
        }

        .active-option {
            border-color: green;
            background: #eaffea;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg p-4 rounded-4 mx-auto" style="max-width: 500px;">
        
        <h3 class="text-center mb-3">💳 Payment</h3>

        <!-- Course Info -->
        <div class="text-center mb-4">
            <h5 > Selected Course</h5>
            <p class="text-muted">Payment Prosecess <span></span></p>
        </div>

        <form th:action="@{/process-payment}" method="post">

            <input type="hidden" name="courseId" th:value="1">
            <input type="hidden" name="paymentMethod" id="paymentMethod">

            <!-- Payment Options -->
            <div class="mb-3">

                <div class="payment-option mb-2" onclick="selectMethod('UPI', this)">
                    📱 Pay via UPI
                </div>

                <div class="payment-option mb-2" onclick="selectMethod('CARD', this)">
                    💳 Pay via Card
                </div>
              <!--
                <div class="payment-option mb-2" onclick="selectMethod('CASH', this)">
                    💵 Cash (Offline)
                </div>
                
-->
            </div>

            <!-- UPI Input -->
            <div id="upiBox" style="display:none;">
                <input type="text" class="form-control mb-3" placeholder="Enter UPI ID (example@upi)">
            </div>

            <!-- Card Inputs -->
            <div id="cardBox" style="display:none;">
                <input type="text" class="form-control mb-2" placeholder="Card Number">
                <input type="text" class="form-control mb-2" placeholder="Expiry MM/YY">
                <input type="text" class="form-control mb-3" placeholder="CVV">
            </div>

            <!-- Cash Message -->
            <div id="cashBox" style="display:none;" class="alert alert-info">
                Pay cash at office / instructor.
            </div>
            
            <button class="btn btn-success w-100 mt-3">
                Pay Now
            </button>

        </form>

    </div>

</div>

<script>
    function selectMethod(method, element) {

        document.getElementById("paymentMethod").value = method;

        // remove active class
        document.querySelectorAll('.payment-option').forEach(el => {
            el.classList.remove('active-option');
        });

        element.classList.add('active-option');

        // hide all
        document.getElementById("upiBox").style.display = "none";
        document.getElementById("cardBox").style.display = "none";
        document.getElementById("cashBox").style.display = "none";

        // show selected
        if(method === 'UPI') {
            document.getElementById("upiBox").style.display = "block";
        }
        if(method === 'CARD') {
            document.getElementById("cardBox").style.display = "block";
        }
        if(method === 'CASH') {
            document.getElementById("cashBox").style.display = "block";
        }
    }
</script>

</body>
</html>
