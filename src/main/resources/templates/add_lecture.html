<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload Lecture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(135deg, #141e30,#243B55);">

<div class="container mt-5">

    <div class="card p-4 shadow-lg rounded-4 col-md-6 mx-auto">

        <h3 class="text-center mb-3">🎥 Upload Lecture</h3>

        <div th:if="${message}" class="alert alert-success">
            <p th:text="${message}"></p>
        </div>

        <form th:action="@{/add-lecture}" method="post" enctype="multipart/form-data">

            <input type="hidden" name="courseId" th:value="${courseId}">

            <div class="mb-3">
                <label>Lecture Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Upload Video</label>
                <input type="file" name="videoFile" class="form-control" accept="video/*" required>
            </div>

            <button class="btn btn-primary w-100 rounded-pill">
                🚀 Upload Lecture
            </button>

        </form>

    </div>

</div>

</body>
</html>
