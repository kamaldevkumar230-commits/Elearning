<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #141e30, #243B55);
            min-height: 100vh;
            color: #fff;
        }

        .glass-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            transition: 0.3s;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .course-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            transition: 0.3s;
        }

        .course-card:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .course-img {
            height: 180px;
            object-fit: cover;
            width: 100%;
        }

        .course-body {
            padding: 15px;
            color: #000;
        }

        .btn-custom {
            border-radius: 30px;
        }
    </style>
</head>

<body>
<div th:replace="navbar :: navbar"></div>
<div class="container py-4">

    <h2 class="mb-4">👨‍🎓 Welcome, Student</h2>

    <!-- 🔥 STATS -->
    <div class="row g-3">

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-book fa-2x"></i>
                <h6 class="mt-2">Courses</h6>
                <h3 th:text="${courses.size()}">0</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-check-circle fa-2x"></i>
                <h6 class="mt-2">Completed</h6>
                <h3>--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-clock fa-2x"></i>
                <h6 class="mt-2">Hours</h6>
                <h3>--</h3>
            </div>
        </div>

        <div class="col-md-3">
            <div class="glass-card text-center">
                <i class="fa fa-trophy fa-2x"></i>
                <h6 class="mt-2">Achievements</h6>
                <h3>--</h3>
            </div>
        </div>
        

    </div><br><br>
    <a href="/my-courses" class="btn btn-dark">
    📚 My Courses
    </a> <br><br>

    <!-- 🔥 COURSES -->
    <div class="mt-5">
        <h4>📚 Available Courses</h4>

        <div class="row mt-3">

            <div th:each="course : ${courses}" class="col-md-4">

                <div class="course-card mb-4">

                    <!-- Image -->
                    <img th:src="@{'/images/' + ${course.imageUrl}}" class="course-img">

                    <div class="course-body">

                        <h5 th:text="${course.title}"></h5>

                        <p th:text="${course.description}" style="font-size:14px;"></p>

                        <p><b>₹ </b><span th:text="${course.price}"></span></p>

                        <!-- Action -->
                        <div class="text-center mt-2">

                            <form th:action="@{/enroll}" method="post">
                                <input type="hidden" name="courseId" th:value="${course.id}">

                                <button class="btn btn-success btn-sm btn-custom w-100">
                                    🎓 Enroll Now
                                </button>
                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Empty -->
        <div th:if="${#lists.isEmpty(courses)}" class="alert alert-light mt-3 text-dark text-center">
            No courses available yet.
        </div>

    </div>

</div>


<div th:replace="footer :: footer"></div>
</body>
</html>
