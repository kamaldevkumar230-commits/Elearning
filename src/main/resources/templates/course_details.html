<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Course Lectures</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg,#141e30,#243B55);
        }

        .video-card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .video-card:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h3 class="text-white mb-4">📚 Course Lectures</h3>

    <div class="row">

        <div th:each="lecture : ${lectures}" class="col-md-6">

            <div class="card video-card mb-4 p-3">

                <h5 th:text="${lecture.title}"></h5>

                <!-- VIDEO -->
                <video width="100%" controls>
                    <source th:src="@{'/video/' + ${lecture.videoUrl}}" type="video/mp4">
                </video>

                <!-- Actions -->
                <div class="mt-2 d-flex justify-content-between">

                    <a th:href="@{'/delete-lecture/' + ${lecture.id} + '/' + ${courseId}}"
                       class="btn btn-danger btn-sm">
                        🗑 Delete
                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- Empty -->
    <div th:if="${#lists.isEmpty(lectures)}" class="alert alert-light">
        No lectures available.
    </div>

</div>

</body>
</html>
