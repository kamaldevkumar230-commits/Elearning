<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Add Course</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Font Awesome -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(to right, #667eea, #764ba2);
			min-height: 100vh;
		}

		.card {
			border-radius: 20px;
		}
	</style>
</head>

<body>

	<div class="container mt-5">

		<div class="row justify-content-center">
			<div class="col-md-6">

				<div class="card shadow-lg p-4">
					<h3 class="text-center mb-4">
						<i class="fa fa-book"></i> Add New Course
					</h3>

					<!-- SUCCESS MESSAGE -->
					<div th:if="${message}" class="alert alert-success">
						<p th:text="${message}"></p>
					</div>

					<form th:action="@{/add-course}" th:object="${course}" method="post" enctype="multipart/form-data">
						<!-- 🔥 IMPORTANT -->

						<!-- Course Title -->
						<div class="mb-3">
							<label class="form-label">Course Title</label>
							<input type="text" th:field="*{title}" class="form-control" required>
						</div>

						<!-- Description -->
						<div class="mb-3">
							<label class="form-label">Description</label>
							<textarea th:field="*{description}" class="form-control" rows="4" required></textarea>
						</div>
						
						<!-- price-->
						<div class="mb-3">
							<label class="form-label">Price</label>
							<input type="number" th:field="*{price}" class="form-control"  required></input>
						</div>

						<!-- Video Upload -->
						<div class="mb-3">
							<label class="form-label">Upload Image</label>
							<input type="file" name="imageFile" class="form-control mb-3" accept="image/*">
						</div>

						<!-- Submit -->
						<button type="submit" class="btn btn-primary w-100 rounded-pill">
							➕ Add Course
						</button>

					</form>

				</div>

			</div>
		</div>

	</div>

</body>

</html>
