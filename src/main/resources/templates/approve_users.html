<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Approve Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .btn-approve {
            background: #28a745;
            color: white;
        }
        .btn-approve:hover {
            background: #218838;
        }
    </style>
</head>
<body>
<div th:replace="navbar :: navbar"></div>
<div class="container mt-5">

    <h2 class="text-center mb-4">👨‍💼 User Approval Panel</h2>

    <div class="card p-4">

        <table class="table table-hover text-center align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>

                <td>
                    <span th:if="${user.approved == false}" class="badge bg-warning">Pending</span>
                    <span th:if="${user.approved == true}" class="badge bg-success">Approved</span>
                </td>

                <td>
                    <form th:if="${user.approved == false}" action="/approve-user" method="post">
                        <input type="hidden" name="userId" th:value="${user.id}">
                        <button class="btn btn-approve btn-sm">Approve</button>
                    </form>

                    <span th:if="${user.approved == true}" class="text-success fw-bold">✔ Done</span>
                </td>
            </tr>

            </tbody>
        </table>

    </div>
</div>

</body>
</html>
