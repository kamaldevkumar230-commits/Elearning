<!DOCTYPE html>

<html>
<head>
<title>Login</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(to right, #141e30, #243B55);
}
.card {
    backdrop-filter: blur(10px);
}






</style>
</head>

<body class="bg-light">

<div th:replace="navbar :: navbar"></div>

<!-- CENTER CONTAINER -->
<div class="d-flex justify-content-center align-items-center" style="height: 90vh;">

    <div class="card shadow-lg p-4" style="width: 450px; height:500px; border-radius: 15px;">

        <!-- LOGO -->
        <div class="text-center mb-3">
    <i class="fa-solid fa-graduation-cap fa-3x text-primary"></i>
    <h4 class="mt-2">E-Learning</h4>
</div>

        <h5 class="text-center mb-3">Login</h5>

        <!-- FORM -->
        <form action="/login" method="post">
            <input type="email" name="email" placeholder="Email" class="form-control mb-3" required>
            <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>

            <button class="btn btn-primary w-100 rounded-pill">Login</button>
        </form>

        <!-- ERROR -->
        <p class="mt-3 text-center text-danger">
            [[${error}]]
        </p>

        <!-- REGISTER -->
        <p class="text-center mt-2">
            New user? <a href="/register">Register</a>
        </p>

    </div>

</div>

</body>
</html>
