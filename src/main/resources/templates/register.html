<!DOCTYPE html>

<html>
<head>
<title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body {
    background: linear-gradient(to right, #141e30, #243B55);
}
</style>
</head>
<body class="bg-light">
<div th:replace="navbar :: navbar"></div>
<!-- CENTER -->
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card shadow-lg p-4" style="width: 450px; height:500px; border-radius: 15px;">

        <!-- LOGO (CDN) -->
        <div class="text-center mb-3">
            <i class="fa-solid fa-graduation-cap fa-3x text-success"></i>
            <h4 class="mt-2 fw-bold">E-Learning</h4>
        </div>

        <h5 class="text-center mb-3">Register</h5>

        <!-- FORM -->
        <form action="/register" method="post">
            <input type="text" name="name" placeholder="Name" class="form-control mb-3" required>
            <input type="email" name="email" placeholder="Email" class="form-control mb-3" required>
            <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>

            <button class="btn btn-success w-100 rounded-pill">Register</button>
        </form>

        <!-- LOGIN LINK -->
        <p class="mt-3 text-center">
            Already have account? <a href="/login">Login</a>
        </p>

    </div>

</div>

</body>
</html>
